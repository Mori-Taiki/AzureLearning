title: Azure ロールベースのアクセス制御 (Azure RBAC) で Azure リソースを保護する
summary: Azure RBAC を使って Azure のリソースへのアクセスを管理する方法を学びます。
abstract: |
  このモジュールでは、次のことを行います。
  - 自分自身と他のユーザーのリソースへのアクセスを確認する。
  - リソースへのアクセスを付与する。
  - Azure RBAC の変更のアクティビティ ログを確認する。
prerequisites: |
  - [有効なサブスクリプション](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn)のある Azure アカウント
  - Azure portal やリソース グループなど、Azure の基本概念に関する知識
