uid: learn.wwl.understand-azure-active-directory
metadata:
  title: Microsoft Entra ID を理解する
  description: "このモジュールでは、クラウドベースの ID およびアクセス管理サービスである Microsoft Entra ID について説明できるようになります。AD DS との比較、クラウド サービスのディレクトリとしての役割、セキュリティ機能について理解します。Microsoft Entra Domain Services についても学びます。"
  ms.date: 05/12/2023
  author: wwlpublish
  ms.author: rstearman
  ms.topic: module
  ms.service: azure-active-directory
title: Microsoft Entra ID を理解する
summary: このモジュールでは、Microsoft Entra ID について説明します。Microsoft Entra ID と Active Directory DS を比較し、Microsoft Entra ID P1 と P2 について学び、クラウドでドメイン参加済みのデバイスとアプリを管理するための Microsoft Entra Domain Services を探ります。
abstract: |
  このモジュールを完了すると、次のことができるようになります。
  - Microsoft Entra ID について説明する。
  - Microsoft Entra ID と Active Directory Domain Services (AD DS) を比較する。
  - クラウド アプリのディレクトリとしての Microsoft Entra ID の使われ方を説明する。
  - Microsoft Entra ID P1 と P2 について説明する。
  - Microsoft Entra Domain Services について説明する。
prerequisites: |
  - Windows 11 以降の OS のインストール、保守、トラブルシューティングに関する高い技術スキル。
  - コンピューター ネットワーク、クライアント セキュリティ、アプリケーションの概念に関する深い理解。
  - Active Directory Domain Services の使用経験。
