title: 仮想マシンの可用性の構成
summary: 垂直・水平スケーリングを含む、仮想マシンの可用性の構成方法を学びます。&nbsp;
abstract: |
  このモジュールでは、次のことを学びます。

  -   可用性セットと可用性ゾーンを実装する。

  -   更新ドメインと障害ドメインを実装する。

  -   Azure 仮想マシン スケール セットを実装する。

  -   仮想マシンを自動スケールする。
prerequisites: |
  -   Azure 仮想マシンの作成と管理に関する基本知識。

  -   変動するワークロードに応じてインフラ リソースをスケールさせることについての一般的な知識。
