summary: ストレージのアクセス署名など、Azure Storage の一般的なセキュリティ機能の構成方法を学びます。
abstract: |
  このモジュールでは、次のことを学びます。

  -   URI (Uniform Resource Identifier) と SAS のパラメーターを含む、共有アクセス署名 (SAS) を構成する。

  -   Azure Storage の暗号化を構成する。

  -   カスタマー マネージド キーを実装する。

  -   Azure Storage のセキュリティを改善する方法を提案する。
