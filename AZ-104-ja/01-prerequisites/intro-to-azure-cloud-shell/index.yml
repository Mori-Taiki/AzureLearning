summary: Microsoft Azure Cloud Shell について説明し、その仕組みを学び、基本的な使用手順を確認します。
abstract: |
  このモジュールを完了すると、次のことができるようになります。
    - Azure Cloud Shell とその機能について説明する。
    - Azure Cloud Shell が組織のニーズを満たすかどうかを判断する。
    - Azure Cloud Shell の使い方と、複数のセッションにまたがってファイルを保持する方法を理解する。
prerequisites: |
  - Azure 仮想マシン (VM) の使用経験
  - Azure 仮想ネットワークの使用経験
  - ルーティングおよびルーティング プロトコルの使用経験
  - Azure portal を操作し、Azure PowerShell を使用できること
