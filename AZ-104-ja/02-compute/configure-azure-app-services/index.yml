title: Azure App Service の構成
summary: デプロイ スロットを含む、Azure App Service インスタンスの構成と監視の方法を学びます。
abstract: |
  このモジュールでは、次のことを学びます。

  -   Azure App Service の機能と利用ケースを把握する。

  -   Azure App Service でアプリを作成する。

  -   デプロイ設定、特にデプロイ スロットを構成する。

  -   Azure App Service アプリを保護する。

  -   カスタム ドメイン名を構成する。

  -   Azure App Service アプリをバックアップ・復元する。

  -   Azure Application Insights を構成する。
prerequisites: |
  -   サービスを構成できる程度の、Azure portal の実務知識。

  -   クラウドベースのサービス、特に Web ホスティング サービスに関する基本知識。
